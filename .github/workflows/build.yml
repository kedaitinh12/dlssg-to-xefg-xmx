# Builds the dll on every push and pull request, checks that it exports what the sources declare, runs the tests that need no
# Windows and keeps the result as a workflow artifact laid out like a release (custom\XeMFG XMX\dlssg\... plus plugins\...). Releases are still
# published by hand with release.yml.
#
# The dll has the Vulkan runtime built in (src/vulkan: MFG-Unlocker's D3D12-on-Vulkan layer and the hooks that prepare a
# game's VkDevice for it), so the build clones the Khronos Vulkan headers (.github/actions/vulkan-headers) and fails when
# the runtime didn't get built. MFGUnlocker.asi isn't needed to run it.
#
# What the runtime runs are the Vulkan models, xefg_mfg_programs\vulkan. They are Intel derived data and aren't in the
# repository's history unless its owner puts them there. The build takes them from the first of
#   third_party/xefg_mfg_programs/vulkan/    a folder made by tools/ExtractXeFgVulkanPrograms.py (programs.tsv, <id>.spv, ...)
#   third_party/MFGUnlocker.asi              an MFGUnlocker.asi, 1.7.1 or newer, that the models are extracted from
# that exists, and the artifact has them next to the dll. Missing Vulkan data fails this workflow.
#
# A libxess_fg.dll (XeFG, Intel's as well, so not in the history either) at third_party/libxess_fg.dll is checked from the file
# alone: tools/CheckXeFgBuild.py says whether the build has what this dll relies on, see the step "libxess_fg.dll" of the
# models test.
name: Build OptiScaler XeMFG Vulkan

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  windows:
    name: Windows x64 Release
    runs-on: windows-latest
    needs: [vulkan-provider, vulkan-runtime, vulkan-programs]
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Vulkan headers
        id: vulkan
        uses: ./.github/actions/vulkan-headers

      - name: Build
        shell: pwsh
        run: |
          msbuild dlssg-to-xefg.sln -p:Configuration=Release -p:Platform=x64 -m "-p:VulkanIncludeDir=${{ steps.vulkan.outputs.include }}" '-flp:logfile=msbuild.log;verbosity=minimal'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Without the headers the project builds a dll that has no Vulkan runtime and only warns, which this job must not pass for a good build
          if (-not (Select-String -Path msbuild.log -Pattern "Vulkan runtime: built in" -Quiet)) {
            throw "The dll was built without the Vulkan runtime, see the 'Vulkan runtime' line of the build log"
          }

      # msbuild already runs the project's GenerateXeFgPrograms target. Run the generator again so a build that
      # skipped it still leaves the pinned programs and tensor-core fatbin; it is a no-op when current.
      - name: Generate XeFG MFG programs
        shell: pwsh
        run: ./tools/GenerateXeFgPrograms.ps1 -Output bin\Release\xefg_mfg_programs -Cache obj\Release\packages

      # Install minimal CUDA Toolkit 13.4 (nvcc + nvvm + cudart + crt + cccl) so CI always builds xefg_cuda_layers.fatbin
      # from the optimized src/MfgPort/Cuda/xefg_cuda_layers.cu (sm_75/86/89/120 + compute_86 PTX).
      - name: Setup CUDA Toolkit (13.5/13.4 minimal nvcc for MSVC 14.52)
        id: cuda_setup
        continue-on-error: true
        shell: pwsh
        run: |
          function Test-CudaToolchain([string]$dir) {
            return (Test-Path (Join-Path $dir "bin\nvcc.exe")) -and
                   (Test-Path (Join-Path $dir "include\crt\host_config.h")) -and
                   (Test-Path (Join-Path $dir "nvvm\bin\cicc.exe"))
          }
          $cudaDir = $null
          foreach ($v in @("13.5", "13.4")) {
            $d = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v$v"
            if (Test-CudaToolchain $d) {
              $cudaDir = $d
              break
            }
          }
          if (-not $cudaDir) {
            $installer = $null
            $selectedMinor = $null
            # CUDA 13.4+ uses _x86_64 installer filenames and no longer bundles GPU drivers (since 13.1).
            $candidates = @(
              @{ Ver = "13.5.0"; Minor = "13.5"; Path = "network_installers/cuda_13.5.0_windows_x86_64_network.exe" },
              @{ Ver = "13.4.3"; Minor = "13.4"; Path = "network_installers/cuda_13.4.3_windows_x86_64_network.exe" },
              @{ Ver = "13.4.2"; Minor = "13.4"; Path = "network_installers/cuda_13.4.2_windows_x86_64_network.exe" },
              @{ Ver = "13.5.0"; Minor = "13.5"; Path = "local_installers/cuda_13.5.0_windows_x86_64.exe" },
              @{ Ver = "13.4.3"; Minor = "13.4"; Path = "local_installers/cuda_13.4.3_windows_x86_64.exe" }
            )
            foreach ($c in $candidates) {
              $url = "https://developer.download.nvidia.com/compute/cuda/$($c.Ver)/$($c.Path)"
              $leaf = Split-Path $c.Path -Leaf
              $cand = Join-Path $env:RUNNER_TEMP $leaf
              try {
                Write-Host "Trying NVIDIA CUDA $($c.Ver): $leaf..."
                Invoke-WebRequest -Uri $url -OutFile $cand -ErrorAction Stop
                $installer = $cand
                $selectedMinor = $c.Minor
                break
              } catch {
                Write-Host "  Not at $leaf ($($_.Exception.Message))"
              }
            }
            if ($installer) {
              $cudaDir = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v$selectedMinor"
              $minimalPkgs = @("nvcc_$selectedMinor", "nvvm_$selectedMinor", "cudart_$selectedMinor", "crt_$selectedMinor", "cccl_$selectedMinor")
              Write-Host "Installing minimal CUDA $selectedMinor components ($($minimalPkgs -join ', '))..."
              $proc = Start-Process -FilePath $installer -ArgumentList (@("-s") + $minimalPkgs) -Wait -PassThru
              if ($proc.ExitCode -ne 0 -or -not (Test-CudaToolchain $cudaDir)) {
                Write-Warning "Minimal CUDA $selectedMinor install exited with code $($proc.ExitCode) or missed compiler components; retrying full silent toolkit install (-s)..."
                $proc2 = Start-Process -FilePath $installer -ArgumentList "-s" -Wait -PassThru
                if ($proc2.ExitCode -ne 0) {
                  Write-Warning "Full silent CUDA $selectedMinor install exited with code $($proc2.ExitCode)"
                }
              }
            }
          }
          if ($cudaDir -and (Test-CudaToolchain $cudaDir)) {
            "CUDA_PATH=$cudaDir" >> $env:GITHUB_OUTPUT
            "CUDA_PATH=$cudaDir" >> $env:GITHUB_ENV
            Write-Host "CUDA Toolkit ready at $cudaDir"
          } else {
            Write-Warning "CUDA toolchain incomplete at $cudaDir (expected bin\nvcc.exe, include\crt\host_config.h, nvvm\bin\cicc.exe); build will keep the extracted fatbin."
          }

      # Rebuild xefg_cuda_layers.fatbin from the optimized src/MfgPort/Cuda/xefg_cuda_layers.cu AFTER
      # GenerateXeFgPrograms.ps1 so the extracted fatbin does not overwrite the newly built sm_120/PTX fatbin.
      - name: Rebuild CUDA tensor-core fatbin
        id: cuda_rebuild
        shell: pwsh
        run: |
          $cudaRoot = if ($env:CUDA_PATH) { $env:CUDA_PATH } else { "${{ steps.cuda_setup.outputs.CUDA_PATH }}" }
          if ($cudaRoot -and (Test-Path (Join-Path $cudaRoot "bin\nvcc.exe")) -and (Test-Path (Join-Path $cudaRoot "nvvm\bin\cicc.exe"))) {
            Write-Host "CUDA Toolkit found at $cudaRoot, rebuilding xefg_cuda_layers.fatbin from xefg_cuda_layers.cu..."
            ./tools/GenerateXeFgCuda.ps1 -Output bin\Release\xefg_mfg_programs -CudaRoot $cudaRoot -Source src\MfgPort\Cuda -AllowUnpinnedNvcc
            "rebuilt=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "CUDA Toolkit unavailable on runner; keeping the extracted xefg_cuda_layers.fatbin."
            "rebuilt=false" >> $env:GITHUB_OUTPUT
          }

      # The tensor-core route of both APIs, D3D12 (src/MfgPort/Cuda/cuda_route.cpp) and Vulkan (src/vulkan/xvk_tensor.cpp),
      # launches the 16 kernels of this file.
      - name: Tensor-core fatbin
        shell: pwsh
        run: |
          if ("${{ steps.cuda_rebuild.outputs.rebuilt }}" -eq "true") {
            python tests/vulkan_runtime/check_layer_tables.py --fatbin bin/Release/xefg_mfg_programs/xefg_cuda_layers.fatbin --no-pin
          } else {
            python tests/vulkan_runtime/check_layer_tables.py --fatbin bin/Release/xefg_mfg_programs/xefg_cuda_layers.fatbin
          }

      # Build the 16 D3D12 WMMA / dot4add_i8packed compute shaders (17 <program>.dxbc overrides) into bin\Release\xefg_mfg_programs\wmma
      - name: Build D3D12 WMMA compute shaders (DXC cs_6_6)
        id: wmma_d3d12
        shell: pwsh
        run: |
          ./tools/GenerateXeFgWmma.ps1 -Output bin\Release\xefg_mfg_programs\wmma
          python tools/CheckXeFgWmma.py bin/Release/xefg_mfg_programs/wmma
          if ($LASTEXITCODE -ne 0) { throw "D3D12 WMMA shader validation failed" }
          "built=true" >> $env:GITHUB_OUTPUT

      # The extractor fails when the program set of the asi doesn't check out against the hashes the asi lists itself, the
      # inspector when the asi isn't one this dll can use.
      - name: Vulkan models
        id: models
        shell: pwsh
        run: |
          $target = "bin\Release\xefg_mfg_programs\vulkan"
          $folder = "third_party\xefg_mfg_programs\vulkan"
          $asi = "third_party\MFGUnlocker.asi"

          if (Test-Path (Join-Path $folder "programs.tsv")) {
            New-Item -ItemType Directory -Path $target -Force | Out-Null
            Copy-Item (Join-Path $folder "*") $target -Recurse -Force
            $source = $folder
          } elseif (Test-Path $asi) {
            python tools/InspectMfgUnlockerAsi.py $asi
            if ($LASTEXITCODE -ne 0) { throw "$asi isn't an MFGUnlocker.asi this dll can use" }

            python tools/ExtractXeFgVulkanPrograms.py $asi --output $target
            if ($LASTEXITCODE -ne 0) { throw "The Vulkan models couldn't be extracted from $asi" }
            $source = $asi
          } else {
            throw "Vulkan payload missing: commit third_party/xefg_mfg_programs/vulkan from the supplied ZIP, or provide third_party/MFGUnlocker.asi."
          }

          "source=$source" >> $env:GITHUB_OUTPUT
          Write-Host "Vulkan models from $source"
          exit 0

      - name: Build Vulkan cooperative-matrix shaders (required)
        id: coopmat
        shell: pwsh
        run: |
          ./tools/BuildXeFgCoopMat.ps1 -Output bin/Release/xefg_mfg_programs/vulkan/coopmat
          "built=true" >> $env:GITHUB_OUTPUT

      - name: Require cooperative-matrix build success
        if: always()
        shell: pwsh
        run: |
          if ("${{ steps.coopmat.outcome }}" -ne "success" -or "${{ steps.coopmat.outputs.built }}" -ne "true") {
            throw "Required cooperative-matrix shader build failed or was skipped"
          }

      # Every function the sources mark as exported has to be in the dll's export table, the NGX D3D12 and Vulkan
      # entry points and the OptiScaler plugin entries (OptiPluginInit, InitializeASI) among them.
      - name: Check the exports
        run: |
          python tools/CheckExports.py bin/Release/dlssg_to_xefg_intel_is_better.dll src/Exports.cpp src/ExportsVulkan.cpp src/Plugin.cpp
          python tools/CheckExports.py bin/Release/dlssg_to_xefg_loader.asi src/loader/EarlyLoader.cpp

      - name: Load DLL and resolve exports (no GPU)
        run: python tests/windows/load_plugin.py bin/Release/dlssg_to_xefg_intel_is_better.dll

      - name: Stage
        shell: pwsh
        run: |
          $dlssg = Join-Path $PWD "staging\custom\XeMFG XMX\dlssg"
          $programs = Join-Path $dlssg "xefg_mfg_programs"
          New-Item -ItemType Directory -Path $programs -Force | Out-Null

          Copy-Item bin\Release\dlssg_to_xefg_intel_is_better.dll $dlssg
          # Dedicated lightweight early loader for Vulkan games (supports renamed custom folders & DLLs).
          New-Item -ItemType Directory -Path staging\plugins -Force | Out-Null
          Copy-Item bin\Release\dlssg_to_xefg_loader.asi staging\plugins\dlssg_to_xefg_loader.asi
          Copy-Item docs\OPTISCALER_BUILD_VI.md staging\README-VI.md
          if (Test-Path third_party\libxess_fg.dll) {
            Copy-Item third_party\libxess_fg.dll staging\libxess_fg.dll
          }
          Copy-Item bin\Release\xefg_mfg_programs\* $programs -Recurse

          # The licenses a binary distribution has to carry: this project's, MFG-Unlocker's (its code is in the dll), MinHook's
          Copy-Item LICENSE (Join-Path $dlssg "LICENSE")
          Copy-Item NOTICE.md $dlssg
          Copy-Item src\vulkan\LICENSE-MFG-Unlocker.txt $dlssg
          Copy-Item third_party\minhook\LICENSE.txt (Join-Path $dlssg "LICENSE-MinHook.txt")

          foreach ($name in "programs.tsv", "LICENSE", "xefg_cuda_layers.fatbin") {
            if (-not (Test-Path (Join-Path $programs $name))) { throw "$name is missing from the XeFG MFG program set" }
          }

          $models = "none"
          if ("${{ steps.models.outputs.source }}" -ne "none") {
            foreach ($name in "programs.tsv", "SOURCE.txt", "LICENSE", "7400.spv", "7482.spv") {
              if (-not (Test-Path (Join-Path $programs "vulkan\$name"))) { throw "$name is missing from the Vulkan models" }
            }
            $models = (Get-Content (Join-Path $programs "vulkan\SOURCE.txt") -TotalCount 1)
          }

          python tools/CheckXeFgWmma.py (Join-Path $programs "wmma")
          if ($LASTEXITCODE -ne 0) { throw "Staged D3D12 WMMA payload is invalid" }
          python tools/CheckXeFgCoopMat.py (Join-Path $programs "vulkan/coopmat")
          if ($LASTEXITCODE -ne 0) { throw "Staged cooperative-matrix payload is invalid" }

          @(
            "### dlssg-to-xefg build ${{ github.run_number }}",
            "",
            "- Vulkan runtime: built in, Vulkan headers VK_HEADER_VERSION ${{ steps.vulkan.outputs.version }}",
            "- Vulkan models: $models",
            "- Routes built in: XMX (native), XMX Port (DP4a INT8), CUDA Tensor Cores (sm_75/86/89/120 + compute_86 PTX, rebuilt=${{ steps.cuda_rebuild.outputs.rebuilt }}), AMD WMMA INT8 (D3D12 cs_6_6 & Vulkan VK_KHR_cooperative_matrix)",
            "- Artifact: ``custom\XeMFG XMX\dlssg\dlssg_to_xefg_intel_is_better.dll`` with ``xefg_mfg_programs`` beside it"
          ) -join "`n" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: dlssg-to-xefg-${{ github.run_number }}
          path: staging
          if-no-files-found: error
          retention-days: 30

      # The build log has the compiler's own messages when something above failed
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: msbuild-log-${{ github.run_number }}
          path: msbuild.log
          if-no-files-found: ignore
          retention-days: 7

  # The two ways the Vulkan exports find their provider, on Linux against fakes: the runtime built into the dll (what this
  # build has), and a build without the Vulkan headers that goes through a MFGUnlocker.asi in the process.
  vulkan-provider:
    name: Vulkan provider test
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Newer kernels map memory where the sanitizers expect their shadow memory; lowering this is the usual workaround.
      - name: Allow the sanitizers
        run: sudo sysctl vm.mmap_rnd_bits=28 || true

      - name: Build and run, built-in runtime
        working-directory: tests/vulkan_provider
        run: |
          g++ --version
          g++ -std=c++20 -Wall -Wextra -Wno-unknown-pragmas -Wno-unused-parameter -Wno-cast-function-type \
            -fsanitize=address,undefined -g -D'__declspec(x)=' -I stubs -I ../../src \
            vk_builtin_test.cpp ../../src/ExportsVulkan.cpp ../../src/VulkanProvider.cpp -o vk_builtin_test
          ./vk_builtin_test

      - name: Build and run, MFGUnlocker.asi as the provider
        working-directory: tests/vulkan_provider
        run: |
          g++ -std=c++20 -Wall -Wextra -Wno-unknown-pragmas -Wno-unused-parameter -Wno-cast-function-type \
            -fsanitize=address,undefined -g -D'__declspec(x)=' -I stubs -I ../../src \
            vk_test.cpp ../../src/ExportsVulkan.cpp ../../src/VulkanProvider.cpp ../../src/VulkanRuntimeOff.cpp -o vk_test
          ./vk_test

  # What the Vulkan runtime decides without Vulkan or Windows (VulkanPolicy.h), that every reason it can give has a text, that
  # the D3D12 and Vulkan tensor-core routes have the same layer table, and a syntax check of its Windows-only sources against
  # stand-ins for the Win32, D3D12 and Vulkan APIs with clang++ and g++. The real compile is the Windows job's.
  vulkan-runtime:
    name: Vulkan runtime checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Allow the sanitizers
        run: sudo sysctl vm.mmap_rnd_bits=28 || true

      # A checkout or an archive unpacked on Windows has one file for two names that differ only in case
      - name: No file names that differ only in case
        run: |
          duplicates=$(git ls-files | tr '[:upper:]' '[:lower:]' | sort | uniq -d)
          if [ -n "$duplicates" ]; then echo "$duplicates"; exit 1; fi

      - name: Policy test
        working-directory: tests/vulkan_runtime
        run: |
          g++ -std=c++20 -Wall -Wextra -fsanitize=address,undefined -fno-sanitize-recover=undefined -g \
            -I ../../src policy_test.cpp -o policy_test
          ./policy_test

      - name: Vulkan regression tests
        run: bash tests/vulkan_runtime/check_regressions.sh

      - name: Early loader test
        working-directory: tests/vulkan_runtime
        run: |
          g++ -std=c++20 -Wall -Wextra -fsanitize=address,undefined -fno-sanitize-recover=undefined -g \
            -I ../../src early_loader_test.cpp -o early_loader_test
          ./early_loader_test

      - name: OptiScaler plugin ABI prefix
        run: python tools/CheckOptiScalerAbi.py

      - name: Reason codes
        run: python3 tests/vulkan_runtime/check_reasons.py

      - name: Tensor-core layer tables
        run: python3 tests/vulkan_runtime/check_layer_tables.py

      - name: WMMA RDNA 4 performance model check
        run: python3 tools/BenchmarkXeFgWmmaRdna4.py

      # The checker of a libxess_fg.dll (tools/CheckXeFgBuild.py): its zstd decoder, its reading of this repository's tables and
      # its answer to files that aren't what it expects. None of that needs the dll, which is Intel's.
      - name: XeFG build checker
        run: python3 tests/xefg_build/check_tool.py

      - name: Syntax check of the Windows-only sources
        run: |
          g++ --version
          clang++ --version || true
          bash tests/vulkan_runtime/check_syntax.sh

      - name: Tools
        run: python3 -m py_compile tools/*.py tests/vulkan_runtime/check_reasons.py tests/vulkan_runtime/check_layer_tables.py tests/xefg_build/check_tool.py

  # The reader of xefg_mfg_programs\vulkan (src/VulkanPrograms.cpp) is plain C++, it runs here against synthetic sets and,
  # when the repository has the models, against the real ones.
  vulkan-programs:
    name: Vulkan models test
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Allow the sanitizers
        run: sudo sysctl vm.mmap_rnd_bits=28 || true

      - name: Build and run
        working-directory: tests/vulkan_programs
        run: |
          python3 extractor_test.py
          g++ -std=c++20 -Wall -Wextra -fsanitize=undefined -I ../../src lookup_test.cpp -o lookup_test
          ./lookup_test
          g++ --version
          g++ -std=c++20 -Wall -Wextra -fsanitize=address,undefined -fno-sanitize-recover=undefined -g \
            -DVULKANPROGRAMS_HOSTED -I stubs -I ../../src \
            programs_test.cpp ../../src/VulkanPrograms.cpp -o programs_test
          ./programs_test
          ./programs_test --missing

      - name: Real models, from the folder
        if: hashFiles('third_party/xefg_mfg_programs/vulkan/programs.tsv') != ''
        run: tests/vulkan_programs/programs_test --real third_party/xefg_mfg_programs/vulkan

      - name: Real models, from MFGUnlocker.asi
        if: hashFiles('third_party/xefg_mfg_programs/vulkan/programs.tsv') == '' && hashFiles('third_party/MFGUnlocker.asi') != ''
        run: |
          python3 tools/InspectMfgUnlockerAsi.py third_party/MFGUnlocker.asi
          python3 tools/ExtractXeFgVulkanPrograms.py third_party/MFGUnlocker.asi --output "$RUNNER_TEMP/vulkan"
          tests/vulkan_programs/programs_test --real "$RUNNER_TEMP/vulkan"

      # What depends on the XeFG build, read from the file itself (tools/CheckXeFgBuild.py, no GPU, nothing is run): the API
      # addresses, the program decoder and model catalog the MFG port patches, and the Intel programs that the tensor-core
      # routes' layer table and the Vulkan models recognize. libzstd is on the runner; the models are those of the steps above.
      - name: libxess_fg.dll
        if: hashFiles('third_party/libxess_fg.dll') != ''
        run: |
          models=""
          if [ -f third_party/xefg_mfg_programs/vulkan/programs.tsv ]; then
            models=third_party/xefg_mfg_programs/vulkan
          elif [ -f "$RUNNER_TEMP/vulkan/programs.tsv" ]; then
            models="$RUNNER_TEMP/vulkan"
          fi
          python3 tools/CheckXeFgBuild.py third_party/libxess_fg.dll ${models:+--vulkan-programs "$models"}
