# Builds the dll when triggered manually and publishes it, together with the MFG program data, as a release. The dll has the
# Vulkan runtime built in, so this clones the Khronos Vulkan headers like build.yml does.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Vulkan headers
        id: vulkan
        uses: ./.github/actions/vulkan-headers

      - name: Build
        shell: pwsh
        run: |
          msbuild dlssg-to-xefg.sln -p:Configuration=Release -p:Platform=x64 -m "-p:VulkanIncludeDir=${{ steps.vulkan.outputs.include }}" '-flp:logfile=msbuild.log;verbosity=minimal'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # A release without the Vulkan runtime would build the same and only warn
          if (-not (Select-String -Path msbuild.log -Pattern "Vulkan runtime: built in" -Quiet)) {
            throw "The dll was built without the Vulkan runtime, see the 'Vulkan runtime' line of the build log"
          }

      # msbuild already runs the project's GenerateXeFgPrograms target. Run the generator again so a build
      # that skipped it still publishes the pinned programs and tensor-core fatbin; it is a no-op when current.
      - name: Generate XeFG MFG programs
        shell: pwsh
        run: ./tools/GenerateXeFgPrograms.ps1 -Output bin\Release\xefg_mfg_programs -Cache obj\Release\packages

      - name: Rebuild CUDA tensor-core fatbin (when CUDA Toolkit is present)
        shell: pwsh
        run: |
          if ($env:CUDA_PATH -and (Test-Path (Join-Path $env:CUDA_PATH "bin\nvcc.exe"))) {
            Write-Host "CUDA Toolkit found at $env:CUDA_PATH, rebuilding xefg_cuda_layers.fatbin from xefg_cuda_layers.cu..."
            ./tools/GenerateXeFgCuda.ps1 -Output bin\Release\xefg_mfg_programs -CudaRoot $env:CUDA_PATH -Source src\MfgPort\Cuda -AllowUnpinnedNvcc
          } else {
            Write-Host "No CUDA Toolkit on runner; keeping the extracted xefg_cuda_layers.fatbin."
          }

      - name: Build D3D12 WMMA compute shaders (DXC cs_6_6)
        shell: pwsh
        run: |
          ./tools/GenerateXeFgWmma.ps1 -Output bin/Release/xefg_mfg_programs/wmma
          python tools/CheckXeFgWmma.py bin/Release/xefg_mfg_programs/wmma
          if ($LASTEXITCODE -ne 0) { throw "D3D12 WMMA shader validation failed" }

      - name: Vulkan models (optional when present in repository)
        shell: pwsh
        run: |
          $target = "bin\Release\xefg_mfg_programs\vulkan"
          $folder = "third_party\xefg_mfg_programs\vulkan"
          $asi = "third_party\MFGUnlocker.asi"

          if (Test-Path (Join-Path $folder "programs.tsv")) {
            New-Item -ItemType Directory -Path $target -Force | Out-Null
            Copy-Item (Join-Path $folder "*") $target -Recurse -Force
          } elseif (Test-Path $asi) {
            python tools/ExtractXeFgVulkanPrograms.py $asi --output $target
          }

      - name: Build Vulkan cooperative-matrix shaders (required)
        id: coopmat
        shell: pwsh
        run: |
          ./tools/BuildXeFgCoopMat.ps1 -Output bin/Release/xefg_mfg_programs/vulkan/coopmat
          "built=true" >> $env:GITHUB_OUTPUT

      - name: Require cooperative-matrix build success
        if: always()
        shell: pwsh
        run: |
          if ("${{ steps.coopmat.outcome }}" -ne "success" -or "${{ steps.coopmat.outputs.built }}" -ne "true") {
            throw "Required cooperative-matrix shader build failed or was skipped"
          }

      - name: Package
        shell: pwsh
        run: |
          $zip = Join-Path $PWD "dlssg-to-xefg-${{ github.run_number }}.zip"
          $stage = Join-Path $PWD "staging"
          $dlssg = Join-Path $stage "XeMFG XMX\dlssg"
          $programs = Join-Path $dlssg "xefg_mfg_programs"
          New-Item -ItemType Directory -Path $programs -Force | Out-Null

          Copy-Item bin\Release\dlssg_to_xefg_intel_is_better.dll $dlssg
          Copy-Item bin\Release\xefg_mfg_programs\* $programs -Recurse

          # The licenses a binary distribution has to carry: this project's, MFG-Unlocker's (its code is in the dll), MinHook's
          Copy-Item LICENSE (Join-Path $dlssg "LICENSE")
          Copy-Item NOTICE.md $dlssg
          Copy-Item src\vulkan\LICENSE-MFG-Unlocker.txt $dlssg
          Copy-Item third_party\minhook\LICENSE.txt (Join-Path $dlssg "LICENSE-MinHook.txt")

          if (-not (Test-Path (Join-Path $programs "programs.tsv"))) { throw "The XeFG MFG program set was not generated" }
          if (-not (Test-Path (Join-Path $programs "LICENSE"))) { throw "The XeFG MFG program LICENSE is missing" }
          if (-not (Test-Path (Join-Path $programs "xefg_cuda_layers.fatbin"))) { throw "The XeFG tensor-core fatbin was not generated" }

          python tools/CheckXeFgWmma.py (Join-Path $programs "wmma")
          if ($LASTEXITCODE -ne 0) { throw "Staged D3D12 WMMA payload is invalid" }
          python tools/CheckXeFgCoopMat.py (Join-Path $programs "vulkan/coopmat")
          if ($LASTEXITCODE -ne 0) { throw "Staged cooperative-matrix payload is invalid" }

          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::Open($zip, [System.IO.Compression.ZipArchiveMode]::Create)
          try {
            Get-ChildItem -Path (Join-Path $stage "XeMFG XMX") -Recurse -File | ForEach-Object {
              # Use forward slashes so the zip extracts correctly on all platforms.
              $entryName = $_.FullName.Substring($stage.Length + 1).Replace("\", "/")
              [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($archive, $_.FullName, $entryName) | Out-Null
            }
          } finally {
            $archive.Dispose()
          }
          "ZIP=$zip" >> $env:GITHUB_ENV

      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          gh release create "build-${{ github.run_number }}" $env:ZIP `
            --target "${{ github.sha }}" `
            --title "Build ${{ github.run_number }} ($sha)" `
            --notes "Built from $sha. Vulkan runtime, CUDA sm_120 Tensor Cores, and AMD WMMA INT8 (D3D12 cs_6_6 & Vulkan VK_KHR_cooperative_matrix) built in (Khronos Vulkan headers ${{ steps.vulkan.outputs.version }})."
